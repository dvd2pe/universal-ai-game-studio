name: Image Studio Checks
on:
  push:
    branches: [image-generation-studio]
    paths:
      - "image-studio/**"
      - ".github/workflows/image-studio.yml"
  pull_request:
    paths:
      - "image-studio/**"
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install gradio pillow
      - name: Compile application
        run: python -m py_compile image-studio/app.py
      - name: Compile CPU smoke test
        run: python -m py_compile image-studio/cpu_smoke.py
      - name: Validate Kaggle notebook JSON and code
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          p = Path("image-studio/notebooks/ImageStudio_Kaggle.ipynb")
          nb = json.loads(p.read_text())
          assert nb["nbformat"] == 4
          code = "\n".join("".join(c.get("source", [])) for c in nb["cells"] if c["cell_type"] == "code")
          ast.parse(code)
          print("Notebook JSON and launcher syntax OK")
          PY
