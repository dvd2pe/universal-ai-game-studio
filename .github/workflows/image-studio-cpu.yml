name: Image Studio CPU Inference
on:
  push:
    branches: [image-generation-studio]
    paths:
      - "image-studio/**"
      - ".github/workflows/image-studio-cpu.yml"
  pull_request:
    paths:
      - "image-studio/**"
      - ".github/workflows/image-studio-cpu.yml"
  workflow_dispatch:

jobs:
  cpu-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch and Diffusers
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "diffusers==0.35.1" "transformers==4.57.1" accelerate safetensors pillow
      - name: Generate an image on CPU
        env:
          IMAGE_STUDIO_OUTPUT: ${{ runner.temp }}/image-studio-cpu-output
        run: python image-studio/cpu_smoke.py
      - name: Upload generated PNG
        uses: actions/upload-artifact@v4
        with:
          name: image-studio-cpu-smoke
          path: ${{ runner.temp }}/image-studio-cpu-output/cpu-smoke-test.png
          if-no-files-found: error
          retention-days: 7
